<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전체 실험 61종 — 과목·학년으로 찾기 | Nudge</title>
<meta name="description" content="전기·힘·파동·원자부터 분수·비율·그래프까지 직접 조작하는 실험 61종. 과목과 학년으로 좁혀 보세요. 무료·회원가입 없음·광고 없음.">
<link rel="canonical" href="https://nudge.codingteading.com/all.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nudge">
<meta property="og:title" content="전체 실험 61종 — 과목·학년으로 찾기 | Nudge">
<meta property="og:description" content="전기·힘·파동·원자부터 분수·비율·그래프까지 직접 조작하는 실험 61종. 과목과 학년으로 좁혀 보세요.">
<meta property="og:url" content="https://nudge.codingteading.com/all.html">
<meta property="og:image" content="https://nudge.codingteading.com/og/default.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="전체 실험 61종 — 과목·학년으로 찾기 | Nudge">
<meta name="twitter:description" content="직접 조작하는 과학·수학 실험 61종을 과목과 학년으로 찾아보세요.">
<meta name="twitter:image" content="https://nudge.codingteading.com/og/default.png">
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#080b18">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="stylesheet" href="/assets/fonts/jua.css">
<link rel="stylesheet" href="/site.css">
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <a class="brand" href="/index.html"><svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><line x1="4" y1="16" x2="28" y2="16" stroke="var(--line)" stroke-width="2.8" stroke-linecap="round"/><line x1="8.5" y1="12" x2="8.5" y2="20" stroke="var(--ink-faint)" stroke-width="2.3" stroke-linecap="round" opacity=".55"/><line x1="13" y1="12.8" x2="13" y2="19.2" stroke="var(--ink-faint)" stroke-width="2.3" stroke-linecap="round" opacity=".8"/><circle cx="21" cy="16" r="6" fill="var(--accent-hot)"/></svg><span id="brand"></span></a>
    <nav class="nav">
      <a href="/index.html" id="nav-courses"></a>
      <a href="/all.html" aria-current="page" id="nav-all"></a>
      <span id="langslot"></span>
    </nav>
  </div>
</div>

<header class="wrap all-head">
  <p class="eyebrow" id="tagline"></p>
  <h1 id="h1"></h1>
  <p id="lead"></p>
</header>

<div class="wrap filters">
  <div class="filter-row"><span class="lbl" id="l-subject"></span><span id="subjects" style="display:contents"></span></div>
  <div class="filter-row"><span class="lbl" id="l-grade"></span><span id="grades" style="display:contents"></span></div>
  <div class="filter-row"><span class="lbl"></span><input class="search" id="search" type="search" autocomplete="off"></div>
</div>

<main class="wrap">
  <p class="count" id="count"></p>
  <div id="results"></div>
</main>

<footer class="site">
  <div class="wrap">
    <p id="f-license"></p>
    <p id="f-nonprofit"></p>
  </div>
</footer>

<script type="module">
import { currentLang, loadUI, applyDocLang, langPicker, withLang } from '/lib/i18n.js';

const $ = s => document.querySelector( s );
const el = ( t, p ) => Object.assign( document.createElement( t ), p || {} );
const txt = ( id, v ) => { $( id ).textContent = v; };

/* sims.json 의 과목·학년 값은 한국어로 들어 있습니다. 화면에 쓸 때만 옮깁니다 —
   값 자체를 언어별로 두면 필터 비교가 지저분해집니다. */
const SUBJECT_ORDER = [ '수학', '물리', '화학', '생명과학', '지구과학', '기타' ];
const GRADE_ORDER = [ '초등 3-4', '초등 5-6', '중학교', '고등학교' ];
const SUBJECT_COLOR = {
  수학: 'var(--s-math)', 물리: 'var(--s-phys)', 화학: 'var(--s-chem)',
  생명과학: 'var(--s-bio)', 지구과학: 'var(--s-earth)', 기타: 'var(--s-etc)'
};

const lang = currentLang();
applyDocLang( lang );

const [ t, sims ] = await Promise.all( [
  loadUI( lang ),
  fetch( '/sims.json' ).then( r => r.json() )
] );

const label = ( kind, key ) => t( kind + '.' + key );

/* ─────────── 껍데기 ─────────── */
txt( '#brand', t( 'site.name' ) );
txt( '#tagline', t( 'site.tagline' ) );
txt( '#nav-courses', t( 'nav.courses' ) );
txt( '#nav-all', t( 'nav.all', { n: sims.length } ) );
txt( '#l-subject', t( 'all.subject' ) );
txt( '#l-grade', t( 'all.grade' ) );
txt( '#f-license', t( 'footer.license' ) );
txt( '#f-nonprofit', t( 'footer.nonprofit' ) );
$( '#search' ).placeholder = t( 'all.search' );
$( '#langslot' ).appendChild( langPicker( lang ) );
$( '#nav-courses' ).href = withLang( '/index.html', lang );

const pageTitle = t( 'seo.all.title', { n: sims.length } );
document.title = pageTitle;
txt( '#h1', pageTitle.split( ' | ' )[ 0 ] );
txt( '#lead', t( 'all.lead' ) );

/* ─────────── 상태 ─────────── */
const state = { subject: null, grade: null, query: '' };

function chip( text, pressed, onClick, isGrade ) {
  const b = el( 'button', { className: 'chip', type: 'button', textContent: text } );
  if ( isGrade ) { b.dataset.grade = '1'; }
  b.setAttribute( 'aria-pressed', String( pressed ) );
  b.onclick = onClick;
  return b;
}

function renderFilters() {
  const subs = $( '#subjects' ), grades = $( '#grades' );
  subs.innerHTML = grades.innerHTML = '';

  subs.appendChild( chip( t( 'all.every' ), state.subject === null,
    () => { state.subject = null; render(); } ) );
  SUBJECT_ORDER.filter( s => sims.some( x => x.subject === s ) ).forEach( s => {
    subs.appendChild( chip( label( 'subject', s ), state.subject === s,
      () => { state.subject = s; render(); } ) );
  } );

  grades.appendChild( chip( t( 'all.every' ), state.grade === null,
    () => { state.grade = null; render(); }, true ) );
  GRADE_ORDER.filter( g => sims.some( x => x.grade === g ) ).forEach( g => {
    grades.appendChild( chip( label( 'grade', g ), state.grade === g,
      () => { state.grade = g; render(); }, true ) );
  } );
}

function matches( sim ) {
  if ( state.subject && sim.subject !== state.subject ) { return false; }
  if ( state.grade && sim.grade !== state.grade ) { return false; }
  if ( state.query ) {
    const q = state.query.toLowerCase();
    if ( !( sim.title + ' ' + sim.titleEn ).toLowerCase().includes( q ) ) { return false; }
  }
  return true;
}

function card( sim ) {
  const a = el( 'a', { className: 'simcard',
    href: '/sims/' + sim.repo + '.html?locale=' + lang } );
  a.style.setProperty( '--c', SUBJECT_COLOR[ sim.subject ] || 'var(--s-etc)' );

  const shot = el( 'div', { className: 'shot' } );
  shot.appendChild( el( 'img', { src: '/' + sim.thumb, alt: '', loading: 'lazy' } ) );
  a.appendChild( shot );

  const body = el( 'div', { className: 'body' } );
  body.appendChild( el( 'div', { className: 'name', textContent: sim.title } ) );

  const tags = el( 'div', { className: 'tags' } );
  tags.appendChild( el( 'span', { className: 'tag subject', textContent: label( 'subject', sim.subject ) } ) );
  tags.appendChild( el( 'span', { className: 'tag', textContent: label( 'grade', sim.grade ) } ) );
  if ( !sim.hasKorean ) { tags.appendChild( el( 'span', { className: 'tag warn', textContent: t( 'all.english' ) } ) ); }
  body.appendChild( tags );

  a.appendChild( body );
  return a;
}

function render() {
  renderFilters();

  const shown = sims.filter( matches );
  txt( '#count', t( 'all.count', { n: shown.length } ) );

  const results = $( '#results' );
  results.innerHTML = '';

  if ( !shown.length ) {
    results.appendChild( el( 'p', { className: 'empty', textContent: t( 'all.empty' ) } ) );
    return;
  }

  /* 과목을 아직 안 골랐으면 과목으로, 골랐으면 학년으로 묶습니다 —
     그 시점에 더 쓸모 있는 축이 바뀝니다. */
  const by = state.subject === null ? 'subject' : 'grade';
  const order = by === 'subject' ? SUBJECT_ORDER : GRADE_ORDER;

  order.forEach( key => {
    const items = shown.filter( s => s[ by ] === key );
    if ( !items.length ) { return; }

    const h = el( 'h2', { className: 'group-title' } );
    const dot = el( 'i' );
    dot.style.background = by === 'subject'
      ? ( SUBJECT_COLOR[ key ] || 'var(--s-etc)' ) : 'var(--accent-hot)';
    h.appendChild( dot );
    h.appendChild( document.createTextNode(
      t( 'all.group', { key: label( by, key ), n: items.length } ) ) );
    results.appendChild( h );

    const grid = el( 'div', { className: 'simgrid' } );
    items.forEach( s => grid.appendChild( card( s ) ) );
    results.appendChild( grid );
  } );
}

$( '#search' ).addEventListener( 'input', e => {
  state.query = e.target.value.trim();
  render();
} );

render();
</script>
</body>
</html>
