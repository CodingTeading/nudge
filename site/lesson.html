  <!-- 저작자 표시는 무대와 함께 붙잡지 않습니다 — 고정되는 건 실험 자체뿐입니다 -->

    <section class="blk">
      <p class="label" id="l1"></p>

    <section class="blk predict">
      <p class="label" id="l2"></p>

    </section>

    <section class="blk record">
      <p class="label" id="l4"></p>
      <p id="rq" style="font-size:14.5px"></p>
      <textarea id="rec"></textarea>
    </section>

    <section class="blk explain">
      <p class="label" id="l5"></p>
      <div class="reveal">
        <p class="your" id="your"></p>
        <p style="margin:0" id="verdict"></p>
      </div>
      <div id="explain"></div>
    </section>

    <section class="blk">
      <p class="label" id="l6"></p>
      <p id="real"></p>
    </section>

    <section class="blk check">
      <p class="label" id="l7"></p>
      <div class="quiz" id="quiz"></div>
    </section>

    <div style="display:flex;gap:10px;margin-top:26px">
      <a class="btn primary" id="next"></a>
      <a class="btn ghost" id="tocourse"></a>

</footer>

<script type="module">
import { currentLang, loadUI, loadContent, applyDocLang, langPicker,
         homePath, allPath, coursePath, lessonPath,
         simLocales, simLocaleFor, applySimTitles, LANGS, BASE } from '/lib/i18n.js';
import { applySeo, lessonJsonLd } from '/lib/seo.js';

const $ = s => document.querySelector( s );
const el = ( t, p ) => Object.assign( document.createElement( t ), p || {} );
const txt = ( id, v ) => { $( id ).textContent = v; };
const html = ( id, v ) => { $( id ).innerHTML = v; };

const lang = currentLang();
applyDocLang( lang );

const [ t, courseRes, lessonRes, guideRes, simTable, sims ] = await Promise.all( [
  loadUI( lang ),
  loadContent( 'courses', lang ),
  loadContent( 'lessons', lang ),
  loadContent( 'guides', lang ),
  simLocales(),
  fetch( '/sims.json' ).then( r => r.json() ).then( s => applySimTitles( s, lang ) )
] );

/* 구운 파일이 심어 준 값이 먼저입니다. 없으면 옛 주소(?l=)를 봅니다. */
const lid = window.__NUDGE?.id
  || new URLSearchParams( location.search ).get( 'l' ) || 'static-2';
const L = lessonRes.data[ lid ] || Object.values( lessonRes.data )[ 0 ];
const course = courseRes.data.courses.find( c => c.id === L.course );
const siblings = courseRes.data.lessons[ L.course ];
const idx = siblings.findIndex( x => x.id === lid );
const lessonMeta = siblings[ idx ];

/* ─────────── 껍데기 ─────────── */
txt( '#back', t( 'nav.back' ) );
$( '#langslot' ).appendChild( langPicker( lang ) );
/* 상단바 링크는 언어마다 경로가 달라 스크립트에서 잡습니다. */
document.querySelector( '.brand' ).href = homePath( lang );
txt( '#f-license', t( 'footer.license' ) );
$( '#f-contact' ).innerHTML = t( 'footer.contact' )
  + ' <a href="mailto:codingteading@gmail.com">codingteading@gmail.com</a>';

$( '#back' ).href = $( '#tocourse' ).href = coursePath( L.course, lang );
$( '#next' ).href = siblings[ idx + 1 ]?.id
  ? lessonPath( siblings[ idx + 1 ].id, lang ) : coursePath( L.course, lang );
txt( '#next', t( 'lesson.next' ) );
txt( '#tocourse', t( 'lesson.toCourse' ) );

txt( '#crumb', t( 'lesson.crumb', { course: course.no + ' ' + course.title, i: idx + 1, n: siblings.length } ) );
txt( '#title', L.title );
html( '#lead', L.lead );

applySeo( {
  lang, path: lessonPath( lid, lang ), alt: l => lessonPath( lid, l ),
  title: t( 'seo.lesson.title', { lesson: L.title, course: course.title } ),
  desc: t( 'seo.lesson.desc', {
    hook: L.lead, min: lessonMeta.min,
    sim: sims.find( s => s.repo === L.sim )?.title || L.sim
  } ),
  keywords: t( 'seo.keywords' ), image: 'l-' + lid + '.png',
  jsonld: lessonJsonLd( L, lessonMeta, course, lang )
} );

/* 콘텐츠가 기준 언어로 떨어졌으면 알려 줍니다 */
if ( lessonRes.fellBack ) {
  $( '#langwarn' ).hidden = false;
  txt( '#langwarn', t( 'lang.fallback' ) );
}

/* 수학 레슨은 ② 가 "예상"이 아니라 "먼저 풀어 보기"입니다 — 답이 정해져 있는 문제를
   짐작하라고 하면 어색해집니다. lessons.json 의 mode 가 'solve' 면 같은 키에 .solve 를
   붙인 변형 문구를 씁니다. 네 언어 모두에 넣어 두었으므로 폴백은 일어나지 않습니다. */
const V = L.mode === 'solve' ? '.solve' : '';

[ 1, 2, 3, 4, 5, 6, 7 ].forEach( n => txt( '#l' + n,
  t( 'lesson.block' + n + ( ( n === 2 || n === 5 ) ? V : '' ) ) ) );
html( '#hook', L.hook );
txt( '#mintro', t( 'lesson.missionIntro' ) );
html( '#rq', L.record );
$( '#rec' ).placeholder = t( 'lesson.recordPlaceholder' );
html( '#real', L.real );
html( '#pnote', t( 'lesson.predictNote' + V ) );

/* ─────────── ② 예상 → ⑤ 대조 ─────────── */
let picked = null;
html( '#pq', L.predict.q );
const ch = $( '#choices' );
L.predict.opts.forEach( ( o, i ) => {
  const b = el( 'button', { className: 'choice', type: 'button' } );
  b.setAttribute( 'aria-pressed', 'false' );
  b.appendChild( el( 'span', { className: 'k', textContent: 'ABCD'[ i ] } ) );
  b.appendChild( el( 'span', { innerHTML: o } ) );
  b.onclick = () => {
    picked = i;
    [ ...ch.children ].forEach( ( x, j ) => x.setAttribute( 'aria-pressed', String( j === i ) ) );
    $( '#pnote' ).classList.add( 'show' );
    paintReveal();
  };
  ch.appendChild( b );
} );

function paintReveal() {
  const right = L.explain.right;
  if ( picked === null ) { html( '#your', t( 'lesson.notPicked' + V ) ); html( '#verdict', '' ); return; }
  html( '#your', t( 'lesson.yourPick' + V, { key: 'ABCD'[ picked ], text: L.predict.opts[ picked ] } ) );
  html( '#verdict', picked === right
    ? t( 'lesson.correct' + V, { key: 'ABCD'[ right ] } )
    : t( 'lesson.wrong' + V, { key: 'ABCD'[ right ], text: L.predict.opts[ right ] } ) );
}
html( '#explain', L.explain.body );
paintReveal();

/* ─────────── ③ 미션 · ⑦ 확인 ─────────── */
L.missions.forEach( m => {
  const li = el( 'li' );
  li.setAttribute( 'aria-checked', 'false' );
  li.appendChild( el( 'span', { className: 'box', textContent: '✓' } ) );
  li.appendChild( el( 'span', { className: 'txt', innerHTML: m } ) );
  li.onclick = () => li.setAttribute( 'aria-checked',
    li.getAttribute( 'aria-checked' ) === 'true' ? 'false' : 'true' );
  $( '#missions' ).appendChild( li );
} );

L.quiz.forEach( q => {
  const box = el( 'div' );
  box.appendChild( el( 'p', { className: 'q', innerHTML: q.q } ) );
  const opts = el( 'div', { className: 'choices' } );
  q.opts.forEach( ( o, i ) => {
    const b = el( 'button', { className: 'choice', type: 'button' } );
    b.setAttribute( 'aria-pressed', 'false' );
    b.appendChild( el( 'span', { className: 'k', textContent: i + 1 } ) );
    b.appendChild( el( 'span', { innerHTML: o } ) );
    b.onclick = () => {
      [ ...opts.children ].forEach( ( x, j ) => x.setAttribute( 'aria-pressed', String( j === i ) ) );
      b.style.borderColor = i === q.right ? 'var(--s-bio)' : 'var(--s-chem)';
    };
    opts.appendChild( b );
  } );
  box.appendChild( opts );
  $( '#quiz' ).appendChild( box );
} );

/* ══════════════════════════════════════════════════════
   시뮬레이션 무대
   ══════════════════════════════════════════════════════ */

const SIM = L.sim;
const simMeta = sims.find( s => s.repo === SIM );
const simName = simMeta?.title || SIM;

txt( '#simname', simName );
txt( '#open-label', t( 'stage.open' ) );
txt( '#loading-label', t( 'stage.loading' ) );
txt( '#full', t( 'stage.fullscreen' ) );
txt( '#restart', t( 'stage.restart' ) );
txt( '#hint', t( 'stage.hint' ) );
$( '#poster-img' ).src = '/thumbs/' + SIM + '.png';

/* 저작자 표시 — 푸터가 아니라 시뮬레이션 바로 아래에 둡니다 (CC BY-NC 의 BY 조건).
   좁은 화면에서 고정하면 세 줄을 먹으므로 축약형을 함께 심어 두고 CSS 로 갈아 끼웁니다.
   축약형도 저작자·출처·라이선스·개작 사실을 모두 담고 있어야 합니다. */
const ccLink = ' <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a>';
$( '#credit' ).innerHTML =
  `<span class="credit-long">${ t( 'stage.credit', { sim: simName } ) }${ ccLink }</span>` +
  `<span class="credit-short">${ t( 'stage.creditShort', { sim: simName } ) }${ ccLink }</span>`;

/* 이 시뮬레이션을 이 언어로 열 수 있는가 */
const simLang = simLocaleFor( simTable, SIM, lang );
if ( simLang !== lang ) {
  $( '#simwarn' ).hidden = false;
  txt( '#simwarn', t( 'stage.notTranslated',
    { lang: LANGS.find( l => l.code === lang )?.label || lang } ) );
}

fetch( '/sims/' + SIM + '.html', { method: 'HEAD' } ).then( r => {
  const mb = ( +r.headers.get( 'content-length' ) / 1048576 ).toFixed( 1 );
  if ( mb > 0 ) { txt( '#size', t( 'stage.size', { mb } ) ); }
} ).catch( () => {} );

function simURL() {
  // locale · allowLinks 는 값을 받는 파라미터.
  const p = new URLSearchParams( { locale: simLang, allowLinks: 'false' } );
  if ( L.screens ) { p.set( 'screens', L.screens ); }
  // postMessageOnLoad 는 type:'flag' 라 값을 붙이면 QueryStringMachine 이 죽습니다.
  // URLSearchParams 는 언제나 key=value 로 직렬화하므로 따로 이어 붙입니다.
  return '/sims/' + SIM + '.html?' + p + '&postMessageOnLoad';
}

let frameEl = null;
function mount( into ) {
  const f = el( 'iframe', { src: simURL(), title: simName } );
  f.allow = 'fullscreen; autoplay';   // allowfullscreen 은 이것에 밀리므로 쓰지 않습니다
  into.appendChild( f );
  return f;
}

const isPhone = () => matchMedia( '( max-width: 760px )' ).matches;

/* 휴대폰에서도 인라인으로 엽니다.
   예전에는 전체화면 시트로 열었는데, 그러면 본문과 실험을 오가며 볼 수가 없습니다.
   대신 무대를 상단에 고정해 두고 본문이 그 아래로 지나가게 합니다. */
$( '#poster' ).onclick = () => {
  $( '#poster' ).remove();
  $( '#spin' ).classList.add( 'on' );
  frameEl = mount( $( '#frame' ) );
};

addEventListener( 'message', e => {
  try { if ( JSON.parse( e.data )?.type === 'load' ) { $( '#spin' ).classList.remove( 'on' ); } }
  catch {}
} );

/* ── 무대 조작: 고정 · 확대 ──
 *
 * 확대는 2열이 성립하는 폭에서만 뜻이 있습니다(1열에서는 이미 폭을 다 씁니다).
 * 고정은 반대로 좁은 화면에서 더 쓸모가 큽니다 — 1열에서는 본문을 읽는 동안
 * 무대가 위로 사라져 버리기 때문입니다. 그래서 휴대폰까지 열어 둡니다.
 *
 * 숨기더라도 사용자가 켜 둔 뜻(want*)은 남겨서, 폭이 돌아오면 그대로 되살립니다.
 */
const TKEY = 'nudge.theater', PKEY = 'nudge.pin';
// site.css 의 `@media ( max-width: 1199px )` 와 짝입니다. 한쪽만 고치면 조용히 어긋납니다.
const isWide = () => matchMedia( '( min-width: 1200px )' ).matches;

let wantTheater = localStorage.getItem( TKEY ) === '1';
// 고정은 기본으로 켭니다. 사용법을 접었을 때 왼쪽에 생기는 빈 자리를
// 무대가 따라 내려오며 채워 주기도 합니다.
const savedPin = localStorage.getItem( PKEY );
let wantPin = savedPin === null ? true : savedPin === '1';

function syncStageControls() {
  const wide = isWide();
  const theater = wide && wantTheater;
  // 확대 중에만 뺍니다 — 무대가 화면을 거의 채워 고정할 자리가 없습니다.
  const pin = wantPin && !theater;

  $( '#layout' ).classList.toggle( 'theater', theater );
  $( '#layout' ).classList.toggle( 'pinned', pin );

  $( '#theater' ).hidden = !wide;
  $( '#pin' ).hidden = theater;
  $( '#hint' ).hidden = !wide;

  $( '#theater' ).classList.toggle( 'on', theater );
  $( '#pin' ).classList.toggle( 'on', pin );
  txt( '#theater', t( theater ? 'stage.theaterExit' : 'stage.theater' ) );
  txt( '#pin', t( pin ? 'stage.pinOff' : 'stage.pin' ) );
}

$( '#theater' ).onclick = () => {
  wantTheater = !wantTheater;
  localStorage.setItem( TKEY, wantTheater ? '1' : '' );
  syncStageControls();
};
$( '#pin' ).onclick = () => {
  wantPin = !wantPin;
  localStorage.setItem( PKEY, wantPin ? '1' : '' );
  syncStageControls();
};
addEventListener( 'resize', syncStageControls );
syncStageControls();

/* ── 전체화면 = 브라우저 전체화면 (이전의 '확대') ── */
$( '#full' ).onclick = () => {
  const target = frameEl || $( '#frame' );
  if ( document.fullscreenElement ) { document.exitFullscreen(); return; }
  ( target.requestFullscreen || target.webkitRequestFullscreen )?.call( target );
};

$( '#restart' ).onclick = () => {
  if ( frameEl ) { frameEl.src = simURL(); $( '#spin' ).classList.add( 'on' ); }
};

/* 단축키 — 확대·전체화면은 유튜브와 같게 T / F, 고정은 P.
   글을 쓰는 중이거나 숨겨진 버튼에는 걸리지 않습니다. */
addEventListener( 'keydown', e => {
  if ( e.metaKey || e.ctrlKey || e.altKey ) { return; }
  const tag = document.activeElement?.tagName;
  if ( tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT' ) { return; }
  const hit = { p: '#pin', t: '#theater', f: '#full' }[ e.key.toLowerCase() ];
  if ( hit && !$( hit ).hidden ) { $( hit ).click(); }
} );


/* ══════════════════════════════════════════════════════
   사용 방법 — 무대 바로 아래
   ══════════════════════════════════════════════════════ */

const G = guideRes.data;
const g = G[ SIM ];
const guide = $( '#guide' );

// 2열이 성립할 때만 펼쳐 둡니다. 1열에서는 펼쳐 두면 이론이 2000px 넘게 밀립니다.
guide.open = isWide();
guide.appendChild( el( 'summary', { textContent: t( 'guide.title' ) } ) );

if ( !g ) {
  guide.appendChild( el( 'p', { className: 'summary', textContent: t( 'guide.missing' ) } ) );
}
else {
  guide.appendChild( el( 'p', { className: 'summary', innerHTML: g.summary } ) );

  if ( g.screens?.length ) {
    guide.appendChild( el( 'h3', { textContent: t( 'guide.screens' ) } ) );
    g.screens.forEach( s => {
      const d = el( 'div', { className: 'scr' } );
      d.appendChild( el( 'span', { className: 'n', innerHTML: s.name } ) );
      d.appendChild( el( 'span', { className: 'w', innerHTML: s.what } ) );
      guide.appendChild( d );
    } );
  }

  if ( g.controls?.length ) {
    guide.appendChild( el( 'h3', { textContent: t( 'guide.controls' ) } ) );
    g.controls.forEach( c => {
      const d = el( 'div', { className: 'ctl' } );
      d.appendChild( el( 'p', { className: 'n', innerHTML: c.name } ) );
      d.appendChild( el( 'p', { className: 'd', innerHTML: c.desc } ) );
      if ( c.tip ) {
        const tip = el( 'p', { className: 't', innerHTML: c.tip } );
        tip.prepend( el( 'b', { className: 't-label', textContent: t( 'guide.tip' ) + ' · ' } ) );
        d.appendChild( tip );
      }
      guide.appendChild( d );
    } );
  }

  if ( g.steps?.length ) {
    guide.appendChild( el( 'h3', { textContent: t( 'guide.steps' ) } ) );
    const ol = el( 'ol', { className: 'steps' } );
    g.steps.forEach( s => ol.appendChild( el( 'li', { innerHTML: s } ) ) );
    guide.appendChild( ol );
  }

  if ( g.gotchas?.length ) {
    guide.appendChild( el( 'h3', { textContent: t( 'guide.gotchas' ) } ) );
    const ul = el( 'ul', { className: 'gotchas' } );
    g.gotchas.forEach( s => ul.appendChild( el( 'li', { innerHTML: s } ) ) );
    guide.appendChild( ul );
  }
}

/* 공통 조작 — 61개 실험에 전부 해당하므로 접어 둡니다 */
if ( G._common ) {
  const det = el( 'details', { className: 'common' } );
  det.appendChild( el( 'summary', { textContent: t( 'guide.common' ) } ) );
  const inner = el( 'div', { className: 'inner' } );
  inner.appendChild( el( 'p', { className: 'intro', innerHTML: G._common.intro } ) );
  G._common.sections.forEach( s => {
    const d = el( 'div', { className: 'ctl' } );
    d.appendChild( el( 'p', { className: 'n', innerHTML: s.name } ) );
    d.appendChild( el( 'p', { className: 'd', innerHTML: s.desc } ) );
    if ( s.tip ) { d.appendChild( el( 'p', { className: 't', innerHTML: s.tip } ) ); }
    inner.appendChild( d );
  } );
  det.appendChild( inner );
  guide.appendChild( det );
}
</script>
</body>
</html>
