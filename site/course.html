<script type="module">
import { currentLang, loadUI, loadContent, applyDocLang, langPicker, withLang } from '/lib/i18n.js';
import { applySeo, courseJsonLd } from '/lib/seo.js';

const $ = s => document.querySelector( s );
const el = ( t, p ) => Object.assign( document.createElement( t ), p || {} );
const txt = ( id, v ) => { $( id ).textContent = v; };

const SUBJECT_COLOR = {
  수학: 'var(--s-math)', 물리: 'var(--s-phys)', 화학: 'var(--s-chem)',
  생명과학: 'var(--s-bio)', 지구과학: 'var(--s-earth)', 기타: 'var(--s-etc)',
  Math: 'var(--s-math)', Physics: 'var(--s-phys)', Chemistry: 'var(--s-chem)',
  Biology: 'var(--s-bio)', 'Earth science': 'var(--s-earth)'
};

const lang = currentLang();
applyDocLang( lang );

const [ t, courseRes, sims ] = await Promise.all( [
  loadUI( lang ),
  loadContent( 'courses', lang ),
  fetch( '/sims.json' ).then( r => r.json() )
] );

const id = new URLSearchParams( location.search ).get( 'c' ) || 'force-unseen';
const c = courseRes.data.courses.find( x => x.id === id ) || courseRes.data.courses[ 0 ];
const color = SUBJECT_COLOR[ c.subject ] || 'var(--s-etc)';

txt( '#nav-courses', t( 'nav.courses' ) );
txt( '#nav-all', t( 'nav.all', { n: sims.length } ) );
txt( '#f-license', t( 'footer.license' ) );
$( '#langslot' ).appendChild( langPicker( lang ) );

$( '#hero' ).style.setProperty( '--c', color );
txt( '#c-no', c.no + ' · ' + c.subject );
txt( '#c-title', c.title );
txt( '#c-lead', c.lead );

if ( courseRes.fellBack ) {
  $( '#langwarn' ).hidden = false;
  txt( '#langwarn', t( 'lang.fallback' ) );
}

/* 레슨 목록이 없는 코스는 시뮬레이션 목록에서 자리표시자를 만듭니다 (시안이라). */
let lessons = courseRes.data.lessons[ c.id ];
if ( !lessons ) {
  lessons = c.sims.map( ( s, i ) => {
    const meta = sims.find( x => x.repo === s );
    return { id: null, sim: s, title: meta?.title || s.replace( /-/g, ' ' ),
             hook: t( 'course.draft' ), min: 14, diff: ( i % 3 ) + 1 };
  } );
}

applySeo( {
  lang, path: 'course.html?c=' + c.id,
  title: t( 'seo.course.title', { course: c.title, subject: c.subject, n: c.sims.length } ),
  desc: t( 'seo.course.desc', { hook: c.hook, lead: c.lead, n: c.sims.length, min: c.minutes } ),
  keywords: t( 'seo.keywords' ), image: 'c-' + c.id + '.png',
  jsonld: courseJsonLd( c, lessons, lang )
} );


lessons.forEach( ( l, i ) => {
  const row = el( 'a', { className: 'lesson-row' } );
  // 원고가 준비된 레슨만 레슨 페이지로. 나머지는 시뮬레이션을 바로 엽니다.
  row.href = withLang( l.ready ? 'lesson.html?l=' + l.id
                               : '/sims/' + l.sim + '.html?locale=' + lang, lang );
  row.style.setProperty( '--c', color );

  row.appendChild( el( 'span', { className: 'idx',
    textContent: String( i + 1 ) } ) );

  /* 시뮬레이션 실제 화면 — 어떤 실험인지 글보다 빨리 알려 줍니다 */
  const shot = el( 'div', { className: 'shot' } );
  shot.appendChild( el( 'img', { src: '/thumbs/' + l.sim + '.png', alt: '', loading: 'lazy' } ) );
  row.appendChild( shot );

  const mid = el( 'div' );
  mid.appendChild( el( 'h3', { textContent: l.title } ) );
  mid.appendChild( el( 'p', { className: 'q', textContent: l.hook } ) );
  row.appendChild( mid );

  const side = el( 'div', { className: 'side' } );
  if ( !l.ready ) { side.appendChild( el( 'span', { className: 'pill', textContent: t( 'course.draft' ) } ) ); }
  side.appendChild( el( 'span', { textContent: l.min + ( lang === 'ko' ? '분' : ' min' ) } ) );
  const d = el( 'span', { className: 'diff' } );
  for ( let k = 1; k <= 3; k++ ) { d.appendChild( el( 'i', { className: k <= l.diff ? 'on' : '' } ) ); }
  side.appendChild( d );
  row.appendChild( side );

  $( '#lessons' ).appendChild( row );
} );
</script>
